<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — MAMA Cafe</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #fff8ed; color: #2a1d10; }
      .card { max-width: 360px; padding: 32px; text-align: center; border-radius: 24px; background: white; box-shadow: 0 8px 32px rgba(180, 83, 9, 0.08); }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { font-size: 14px; color: #6b5b4f; line-height: 1.5; margin: 0 0 16px; }
      button { background: #ea580c; color: white; border: none; padding: 10px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
      .emoji { font-size: 48px; }
   </style>
 </head>
  <body>
    <div class="card">
      <div class="emoji">☕</div>
      <h1>You're offline</h1>
      <p>No internet right now. Once you reconnect, any orders you place will be sent automatically</p>
      <button onclick="location.reload()">Try again</button>
   </div>
 </body>
</html>
